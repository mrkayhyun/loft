name: Feature request / 기능 제안
description: Suggest an idea for Loft / Loft에 대한 아이디어를 제안합니다
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 해결하려는 문제
      description: What are you trying to do? / 무엇을 하려고 하나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 제안하는 해결책
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 검토한 대안
    validations:
      required: false
